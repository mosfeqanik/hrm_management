spring.application.name=sassmodel
# Loads key=value pair
# etc. don't have to be exported by hand for a local `./mvnw spring-boot:run`. Real deployments
# should still set these as actual environment variables.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}

#spring.datasource.username=
#spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT auth
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# First-run seed (creates one SUPER_ADMIN if no users exist yet)
seed.enabled=${SEED_ENABLED:true}
seed.admin.email=${SEED_ADMIN_EMAIL:admin@sassmodel.local}
seed.admin.password=${SEED_ADMIN_PASSWORD:ChangeMe123!}